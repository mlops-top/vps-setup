# Project Metadata
[project]
  name = "vps-setup"
  version = "0.0.0"
  description = "Setting up a virtual private server."
  requires-python = ">=3.14,<3.15"
  authors = [{ name = "Daniel Mizsak", email = "daniel@mizsak.com" }]
  dependencies = ["ansible==14.5.0"]

[dependency-groups]
  dev = [
    "ansible-lint==26.10.1",
    "molecule==26.10.0",
    "molecule-plugins[docker]==26.10.12",
    "prek==0.5.7",
  ]

[tool.uv]
  package = false
  exclude-newer = "1 week"
