# Project Metadata
[project]
  name = "vps-setup"
  version = "0.0.0"
  description = "Setting up a virtual private server."
  requires-python = ">=3.15,<3.16"
  authors = [{ name = "Daniel Mizsak", email = "daniel@mizsak.com" }]
  dependencies = ["ansible==15.0.0"]

[dependency-groups]
  dev = [
    "ansible-lint==26.10.1",
    "molecule==26.11.0",
    "molecule-plugins[docker]==26.11.0",
    "prek==0.5.11",
  ]

[tool.uv]
  package = false
  exclude-newer = "1 week"
