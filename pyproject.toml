# Project Metadata
[project]
  name = "vps-setup"
  version = "0.0.0"
  description = "Setting up a virtual private server."
  authors = [{ name = "Daniel Mizsak", email = "daniel@mizsak.com" }]
  requires-python = ">=3.14"
  dependencies = ["ansible==14.2.0"]

[dependency-groups]
  dev = [
    "ansible-lint==26.6.0",
    "molecule==26.6.0",
    "molecule-plugins[docker]==26.7.15",
    "prek==0.4.11",
  ]

[tool.uv]
  package = false
  exclude-newer = "1 week"
