---
- name: Assert unattended-upgrades is installed
  ansible.builtin.assert:
    that:
      - "'unattended-upgrades' in ansible_facts['packages']"

- name: Assert unattended-upgrades is running and enabled
  ansible.builtin.assert:
    that:
      - service_facts["ansible_facts"]["services"]["unattended-upgrades.service"]["state"] == "running"
      - service_facts["ansible_facts"]["services"]["unattended-upgrades.service"]["status"] == "enabled"

- name: Register effective apt configuration
  # Includes overrides from all apt.conf.d fragments and apt.conf.
  ansible.builtin.command: >
    apt-config dump
  register: apt_configuration
  changed_when: false

- name: Assert effective unattended-upgrades configuration
  ansible.builtin.assert:
    that:
      - item in apt_configuration.stdout_lines
  loop:
    - 'APT::Periodic::Update-Package-Lists "1";'
    - 'APT::Periodic::Unattended-Upgrade "1";'
    - 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'
    - 'Unattended-Upgrade::Automatic-Reboot "true";'
    - 'Unattended-Upgrade::Automatic-Reboot-Time "07:30";'
