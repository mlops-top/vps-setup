---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 6" # Every Saturday at 12:00

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    permissions:
      contents: read
    uses: daniel-mizsak/workflows/.github/workflows/prek.yml@92245e2677c21a319d87cc22d77a5841efe0e25f # v3.0.2

  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: daniel-mizsak/workflows/.github/workflows/lint-cupcake.yml@92245e2677c21a319d87cc22d77a5841efe0e25f # v3.0.2
    with:
      megalinter-config: "./.github/linters/.megalinter.yml"

  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: daniel-mizsak/workflows/.github/actions/setup-just@92245e2677c21a319d87cc22d77a5841efe0e25f # v3.0.2

      - name: Run quality checks with just
        run: |
          just install --locked
          just check-all
